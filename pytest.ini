[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers
markers =
    equivalence_partitioning: ISTQB Equivalence Partitioning specification-based test technique
    boundary_value_analysis: ISTQB Boundary Value Analysis specification-based test technique
    decision_table: ISTQB Decision Table Testing specification-based test technique
    state_transition: ISTQB State Transition Testing specification-based test technique
    error_guessing: ISTQB Experience-based Error Guessing testing technique
    risk_based: ISTQB Risk-Based Testing prioritization and mitigation technique
    traceability: ISTQB Requirements Traceability Matrix validation
    regression: Regression test suite to ensure existing features remain stable
    unit: Isolated unit tests for core models and functions
    api: Integration and REST API testing

