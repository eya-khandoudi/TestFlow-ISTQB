{% extends "base.html" %}

{% block title %}Initialize Test Run - TestFlow ISTQB{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white py-3 border-0">
                <h5 class="fw-bold mb-0"><i class="bi bi-play-circle text-primary"></i> Initialize New Test Run</h5>
                <small class="text-muted">Will snapshot all current active test cases into a clean execution test cycle.</small>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="row mb-3">
                        <div class="col-md-5">
                            <label class="form-label fw-semibold">Run Code <span class="text-danger">*</span></label>
                            <input type="text" name="run_code" class="form-control" placeholder="TR-2026-002" required>
                            <small class="text-muted">Unique execution cycle identifier</small>
                        </div>
                        <div class="col-md-7">
                            <label class="form-label fw-semibold">Run Name <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control" placeholder="e.g. Sprint 2 Regression & Smoke Suite" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Target Test Environment</label>
                        <select name="environment" class="form-select">
                            <option value="QA">QA (Dedicated Test Environment)</option>
                            <option value="Staging">Staging (Pre-Production Mirror)</option>
                            <option value="UAT">UAT (User Acceptance Testing)</option>
                            <option value="Production">Production (Sanity / Smoke)</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Execution Objectives / Scope</label>
                        <textarea name="description" class="form-control" rows="3" placeholder="Specify test objective, build version under test, and entry criteria..."></textarea>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{{ url_for('test_runs.list_test_runs') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">Create Test Run & Snapshot Cases</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
